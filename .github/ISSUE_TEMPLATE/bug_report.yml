name: Bug report
description: Something is broken when installing, signing in or playing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, use the security policy instead of a public issue.
        Check logs before you paste them. Connect's logs can contain signed download URLs and account details.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what went wrong. Paste exact error text.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Mac model
      placeholder: e.g. macOS 27.0.1, M5 Pro
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed
      options:
        - With the install line from the README
        - Built the runtime myself with make build
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The first line of `~/Library/Application Support/Trackmania2020/runtime/*/build-info.txt`, or the commit you built from.
      placeholder: e.g. Trackmania2020-MacOS runtime 1.0.0
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where it failed
      options:
        - Installing
        - make build
        - Opening Ubisoft Connect
        - Signing in
        - Downloading the game
        - Starting the game
        - Playing
    validations:
      required: true
  - type: input
    id: displays
    attributes:
      label: Displays connected
      placeholder: e.g. laptop panel only, or laptop panel and one external monitor
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: From ~/Games/TM2020/logs, such as connect.log, install.log or start.log. Trim long files.
      render: text
    validations:
      required: false
