# DXVK settings per program. bin/tm2020 gives DXVK to this executable only.

# WebGL in Ubisoft Connect's GPU process.
#
# DataDome guards Ubisoft's sign-in and reads the WebGL renderer. It rejected SwiftShader,
# and also the real Apple GPU when it is seen on Windows, so this reports a GPU that real
# Windows browsers have. It is the workaround from MetalSharp issue #718.
[UplayWebCore.exe]
dxgi.customVendorId = 1002
dxgi.customDeviceId = 73bf
dxgi.customDeviceDesc = "AMD Radeon RX 6800 XT"

# Connect's install folder is not ours to write in.
dxvk.enableStateCache = False
